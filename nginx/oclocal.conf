# oclocal — public TLS template (nginx + Let's Encrypt)
#
# Copy to node2 after certbot has issued a cert for $DOMAIN:
#   sudo certbot certonly --nginx -d llm.example.com
#   sudo sed 's/llm.example.com/your-domain/' oclocal.conf > /etc/nginx/sites-available/oclocal
#   sudo ln -s /etc/nginx/sites-available/oclocal /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name llm.example.com;

    # ACME + redirect
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name llm.example.com;

    ssl_certificate     /etc/letsencrypt/live/llm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The bridge streams long completions — do not let nginx cut them off.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    chunked_transfer_encoding on;
    client_max_body_size 16m;

    location /v1/ {
        proxy_pass http://127.0.0.1:8899/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # optional: health for uptime checks
    location = /health {
        proxy_pass http://127.0.0.1:8899/health;
    }
}
